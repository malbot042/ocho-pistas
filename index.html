<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocho Pistas · secuenciador en el navegador</title>
<meta name="description" content="Secuenciador musical de 8 pistas con batería, bajo, piano, melodía y pad. Funciona en el navegador, sin instalar nada.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Aplica el tema antes de pintar para evitar parpadeo
  (function () {
    var t = null;
    try { t = localStorage.getItem('ochopistas.theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="var(--accent)"/><path d="M8 9v10M12 7v14M16 11v6M20 8v12" stroke="var(--accent-fg)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div class="brand-text">
      <input id="songName" class="song-name" aria-label="Nombre de la canción" maxlength="60">
      <div id="saveStatus" class="save-status">Guardado en este navegador</div>
    </div>
  </div>

  <nav class="tabs" aria-label="Vistas">
    <button class="tab" data-view="seq">Secuenciador</button>
    <button class="tab" data-view="notes">Notas</button>
    <button class="tab" data-view="mix">Mezclador</button>
  </nav>

  <div class="spacer"></div>

  <div class="transport">
    <button id="btnRewind" class="ibtn" aria-label="Volver al inicio" title="Volver al inicio">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg>
    </button>
    <button id="btnPlay" class="ibtn play" aria-label="Reproducir (barra espaciadora)" title="Reproducir / parar (espacio)">
      <svg class="i-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7z"/></svg>
      <svg class="i-stop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <div class="seg" role="group" aria-label="Modo de reproducción">
      <button id="modePattern" class="seg-btn">Patrón</button>
      <button id="modeSong" class="seg-btn">Canción</button>
    </div>
  </div>

  <div class="lcd">
    <span id="position" class="mono big">01.1</span>
    <span class="sep"></span>
    <label class="lcd-field"><input id="bpm" type="number" min="40" max="240" step="1" class="mono" aria-label="Tempo en BPM"><span>BPM</span></label>
    <span class="sep"></span>
    <label class="lcd-field"><input id="swing" type="number" min="0" max="60" step="1" class="mono" aria-label="Swing en porcentaje"><span>% swing</span></label>
  </div>

  <div class="menu-wrap">
    <button id="btnTheme" class="ibtn" aria-label="Cambiar a modo claro" title="Modo claro / oscuro">
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="btnMenu" class="btn-primary" aria-haspopup="menu" aria-expanded="false">Archivo</button>
    <div id="fileMenu" class="menu" role="menu" hidden>
      <button role="menuitem" data-action="new">Nueva canción</button>
      <button role="menuitem" data-action="demo">Cargar canción de ejemplo</button>
      <hr>
      <button role="menuitem" data-action="export">Descargar canción (.json)</button>
      <button role="menuitem" data-action="import">Abrir canción (.json)…</button>
    </div>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<main id="app"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="dropHint" class="drop-hint" hidden>Suelta el archivo .json para abrir la canción</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
